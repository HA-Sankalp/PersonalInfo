<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .player {
            width: 100%;
            max-width: 560px;
            background: #181818;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .back {
            margin-top: 40px;
            color: #3ea6ff;
            text-decoration: none;
            font-size: 1rem;
        }
        .back:hover { text-decoration: underline; }
        .emoji {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }
    </style>
</head>
<body>
    <div class="emoji">🖕</div>
    <h1>Thanks for the tip</h1>
    <div class="sub">Appreciate the support ❤️</div>

    <div class="player">
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/1ktSoIbmqBs?autoplay=1&rel=0&modestbranding=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <a href="index.html" class="back">← Back to clips</a>
</body>
</html>
